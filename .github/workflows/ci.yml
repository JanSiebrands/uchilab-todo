name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Daily run on main, so a newly published vulnerability turns the pipeline red without waiting for
  # the next pull request (ADR 0002).
  schedule:
    - cron: "0 4 * * *"
  # Manual run, e.g. to recheck main or a branch: gh workflow run ci.yml --ref <branch>.
  workflow_dispatch:

# No secrets, no stored signing key, read-only token. External actions are pinned to commit SHAs.
permissions:
  contents: read

# Commit the reviewers were handed: the head of the pull request (not the merge commit github.sha), otherwise
# the pushed commit. Part of every artifact name (UCH-69).
env:
  REVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    name: Build, tests, lint, R8, privacy check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Validates the wrapper JAR against the published checksums before the first ./gradlew call (ADR 0001). Once
      # per run, here in a required check; the other jobs run in parallel without it (plan UCH-125 section 3).
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # Debug build, unit and UI tests, lint, release build with R8 (unsigned), R8 result check,
      # privacy check (permissions allowlist, backup rules, including the tests of the checks themselves).
      - id: gradle
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest lint r8Check privacyCheck
      # Reviewers read this run instead of building themselves (UCH-66): reports, debug APK and R8 mapping,
      # also after a red build. Build outputs only, no signing key, no secret (the repository is public).
      - if: always()
        run: tools/ci/review-artifacts.sh "$RUNNER_TEMP/review" "$GRADLE_OUTCOME"
        env:
          GRADLE_OUTCOME: ${{ steps.gradle.outcome }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ env.REVIEW_SHA }}
          path: ${{ runner.temp }}/review/reports
          retention-days: 14
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apk-${{ env.REVIEW_SHA }}
          path: ${{ runner.temp }}/review/apk
          retention-days: 14
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r8-mapping-${{ env.REVIEW_SHA }}
          path: ${{ runner.temp }}/review/r8
          retention-days: 14
          if-no-files-found: error

  counterprobes:
    name: Counterprobes (each check turns red on a built-in defect)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Counterprobe scripts run only if tools/, .github/ or the Gradle configuration changed (UCH-116 R1b).
      # A skipped step keeps the job green; the job name is a required check and stays (ruleset, Jan).
      - id: filter
        run: tools/ci/pipeline-changed.sh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
      - if: steps.filter.outputs.changed == 'true'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # The rule classes have unit tests (job build); this shows that all three are wired into privacyCheck.
      - if: steps.filter.outputs.changed == 'true'
        run: tools/checks/counterprobes/privacy-check-red.sh

  emulator:
    name: App start on emulator (debug and release with R8)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Counterprobe scripts run only if tools/, .github/ or the Gradle configuration changed (UCH-116 R1b).
      # A skipped step keeps the job green; the job name is a required check and stays (ruleset, Jan).
      - id: filter
        run: tools/ci/pipeline-changed.sh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # The seed for emulator-tasks.sh: invented tasks written by the S2 data layer (EmulatorSeedTest), only in
      # app/build/emulator-seed, never checked in.
      - run: >-
          ./gradlew --console=plain assembleDebug assembleRelease
          :app:testDebugUnitTest --tests de.uchilab.todo.data.EmulatorSeedTest
          -Puchilab.seedOut="$PWD/app/build/emulator-seed"
      # Hardware acceleration for the emulator (standard Linux runners have KVM).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # aosp_atd: minimal AOSP image without Google Play services (the app uses none), fast boot.
      # The action shuts the emulator down at the end of the step.
      # emulator-build pins the emulator binary (37.2.13.0), so a new emulator release cannot turn the job red
      # without a code change. Renovate cannot update it; a newer build is taken over deliberately in a pull
      # request (build ids: https://developer.android.com/studio/emulator_archive). The system image revision
      # cannot be pinned; emulator-versions.sh writes all versions to the log first (UCH-62).
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          emulator-build: "16740729"
          script: |
            tools/checks/emulator-versions.sh
            RUN_COUNTERPROBE=${{ steps.filter.outputs.changed }} tools/checks/emulator-run.sh
      # Logs written by tools/checks/emulator-run.sh (logcat), also after a red run.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-logs-${{ env.REVIEW_SHA }}
          path: app/build/emulator-artifacts
          retention-days: 14
          if-no-files-found: error

  # S4b (UCH-86): a damaged database is never deleted and the read failure notice shows, debug and release (R8),
  # with counterprobes 16k-16n. A job of its own: the emulator job already takes about 21 minutes.
  # Screenshots for the feature PR (UCH-65), evidence, not a check (UCH-116 R2): checked is only that every
  # expected file is there and not empty. aosp_atd renders no picture (screencap and the emulator host give a
  # single colour), so this job uses the full image with rendering.
  screenshots:
    name: Screenshots for the pull request (release with R8)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Counterprobe scripts run only if tools/, .github/ or the Gradle configuration changed (UCH-116 R1b).
      # A skipped step keeps the job green; the job name is a required check and stays (ruleset, Jan).
      - id: filter
        run: tools/ci/pipeline-changed.sh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # Technical seed for the checks (EmulatorSeedTest) and readable seed per language for the pictures
      # (ShowcaseSeedTest, plan UCH-81 section 4); both only in app/build, never checked in.
      - run: >-
          ./gradlew --console=plain assembleRelease
          :app:testDebugUnitTest --tests de.uchilab.todo.data.EmulatorSeedTest
          --tests de.uchilab.todo.data.ShowcaseSeedTest
          -Puchilab.seedOut="$PWD/app/build/emulator-seed"
          -Puchilab.showcaseOut="$PWD/app/build/showcase-seed"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Pinned like the emulator job (UCH-62, PR #9): emulator-build 16740729 = 37.2.13.0; the system image
      # revision cannot be pinned, emulator-versions.sh logs it (UCH-112). AVD name and options are set here and
      # passed on, because the language switch starts the emulator again with exactly these (restart_emulator
      # in emulator-lib.sh instead of adb reboot, during which the emulator died; UCH-112).
      # Fails the environment (emulator does not start or dies), the step runs once more (R2). If the second try
      # is red as well, the job is red; that goes into the PR text, nobody stabilises the job within the feature.
      - id: shots
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          EMULATOR_AVD: test
          EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        with:
          api-level: 34
          target: default
          arch: x86_64
          emulator-build: "16740729"
          avd-name: ${{ env.EMULATOR_AVD }}
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          script: |
            tools/checks/emulator-versions.sh
            tools/checks/emulator-screenshots.sh
      - if: steps.shots.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          EMULATOR_AVD: test
          EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        with:
          api-level: 34
          target: default
          arch: x86_64
          emulator-build: "16740729"
          avd-name: ${{ env.EMULATOR_AVD }}
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          script: |
            tools/checks/emulator-versions.sh
            tools/checks/emulator-screenshots.sh
      - run: tools/checks/screenshots-check.sh app/build/emulator-artifacts/screenshots
      - if: steps.filter.outputs.changed == 'true'
        run: tools/checks/counterprobes/screenshots-check-red.sh
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ env.REVIEW_SHA }}
          path: app/build/emulator-artifacts
          retention-days: 14
          if-no-files-found: error

  # Official images, pinned by digest, no download from GitHub releases (plan UCH-125 section 3). Renovate's
  # github-actions manager updates docker:// references in uses.
  secrets:
    name: Secret scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: dir --no-banner --redact --config tools/checks/gitleaks.toml .
      - uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        # git in the container runs as another user than the owner of the workspace ("dubious ownership").
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"
        with:
          args: git --no-banner --redact --config tools/checks/gitleaks.toml .

  vulnerabilities:
    name: Dependency vulnerability scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tools/checks/vuln-scan.sh
      # Libraries that end up in the app: a finding turns the job red (ADR 0002).
      - uses: docker://ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
        with:
          args: scan source --offline-vulnerabilities --download-offline-databases --lockfile=build/osv/shipped/gradle.lockfile
      # Test and build tool libraries are not shipped in the app: informational only, update when convenient.
      - continue-on-error: true
        uses: docker://ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
        with:
          args: scan source --offline-vulnerabilities --download-offline-databases --lockfile=build/osv/other/gradle.lockfile

  # APK to try out for every pull request (ADR 0004). Runs only if all required jobs are green; not after the
  # screenshots (both are evidence, UCH-116 R2). The upload is the last step before the summary, after the
  # install and start test of exactly this file on API = minSdk. Signing key per pull request in the Actions
  # cache (no secret).
  tryout-apk:
    name: APK to try out (pull requests only)
    if: github.event_name == 'pull_request'
    needs: [build, counterprobes, emulator, secrets, vulnerabilities]
    runs-on: ubuntu-26.04
    # Two runs of the same pull request must not both create a key: wait instead of cancelling.
    concurrency:
      group: tryout-apk-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # The commit Jan sees in the pull request, not github.sha (the merge commit).
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew --console=plain assembleRelease r8Check
      # Signing key of this pull request; created by tryout-prepare.sh on a cache miss. Exact key, no
      # restore-keys. Caches of pull_request runs are only visible to runs of the same pull request.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tryout-signing
          key: tryout-signing-pr-${{ github.event.pull_request.number }}
      - id: apk
        run: tools/ci/tryout-prepare.sh "$RUNNER_TEMP/tryout-signing" "$RUNNER_TEMP/tryout"
      # Hardware acceleration for the emulator (standard Linux runners have KVM).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # API 26 = minSdk (checked by the script). target default: there is no aosp_atd image below API 30.
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 26
          target: default
          arch: x86_64
          script: tools/ci/tryout-emulator-run.sh "${{ steps.apk.outputs.path }}" "${{ steps.apk.outputs.min-sdk }}"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          archive: false
          retention-days: 30
          if-no-files-found: error
      - run: tools/ci/tryout-summary.sh
        env:
          NAME: ${{ steps.apk.outputs.name }}
          URL: ${{ steps.upload.outputs.artifact-url }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
          FINGERPRINT: ${{ steps.apk.outputs.fingerprint }}
          KEY: ${{ steps.apk.outputs.key }}
          MIN_SDK: ${{ steps.apk.outputs.min-sdk }}

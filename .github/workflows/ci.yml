name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Daily run on main, so a newly published vulnerability turns the pipeline red without waiting for
  # the next pull request (ADR 0002).
  schedule:
    - cron: "0 4 * * *"
  # Manual run, e.g. to recheck main or a branch: gh workflow run ci.yml --ref <branch>.
  workflow_dispatch:

# No secrets, no signing key, read-only token. External actions are pinned to commit SHAs.
permissions:
  contents: read

jobs:
  build:
    name: Build, tests, lint, R8, privacy check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Validate the wrapper before the first ./gradlew call, so a manipulated JAR never runs.
      - run: tools/checks/wrapper-check.sh
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # Debug build, unit and UI tests, lint, release build with R8 (unsigned), R8 result check,
      # privacy check (permissions allowlist, backup rules, including the tests of the checks themselves).
      - run: ./gradlew assembleDebug assembleRelease testDebugUnitTest lint r8Check privacyCheck
      # privacyCheck regenerated app/schemas from the code (KSP + copyRoomSchemas). Red if that changed the
      # checked-in schema, i.e. the field list was checked against a stale schema (DSGVO P4, counterprobe 15c).
      - run: tools/checks/schema-check.sh

  counterprobes:
    name: Counterprobes (each check turns red on a built-in defect)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Validate the wrapper before the first ./gradlew call, so a manipulated JAR never runs.
      - run: tools/checks/wrapper-check.sh
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: tools/checks/counterprobes/run-all.sh

  emulator:
    name: App start on emulator (debug and release with R8)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Validate the wrapper before the first ./gradlew call, so a manipulated JAR never runs.
      - run: tools/checks/wrapper-check.sh
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew --console=plain assembleDebug assembleRelease
      # Hardware acceleration for the emulator (standard Linux runners have KVM).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # aosp_atd: minimal AOSP image without Google Play services (the app uses none), fast boot.
      # The action shuts the emulator down at the end of the step.
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          script: tools/checks/emulator-run.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: tools/checks/secret-scan-selftest.sh
      - run: tools/checks/secret-scan.sh
      - run: tools/checks/secret-scan.sh --history

  vulnerabilities:
    name: Dependency vulnerability scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tools/checks/vuln-scan-selftest.sh
      - run: tools/checks/vuln-scan.sh

name: CI

on:
  pull_request:
  push:
    branches: [main]

# No secrets, no signing key, read-only token. External actions are pinned to commit SHAs.
permissions:
  contents: read

jobs:
  build:
    name: Build, tests, lint, R8, privacy check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # Debug build, unit and UI tests, lint, release build with R8 (unsigned), privacy check
      # (including the tests of the checks themselves).
      - run: ./gradlew assembleDebug assembleRelease testDebugUnitTest lint privacyCheck

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: tools/checks/secret-scan-selftest.sh
      - run: tools/checks/secret-scan.sh
      - run: tools/checks/secret-scan.sh --history

  vulnerabilities:
    name: Dependency vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tools/checks/vuln-scan-selftest.sh
      - run: tools/checks/vuln-scan.sh

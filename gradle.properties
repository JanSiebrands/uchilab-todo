org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# No Kotlin daemon: compile inside the Gradle daemon. An idle Gradle daemon stops after 10 minutes. Both keep
# memory free on the shared machine (UCH-69; Jan's PC froze on 2026-11-06). CI uses the same settings.
kotlin.compiler.execution.strategy=in-process
org.gradle.daemon.idletimeout=600000
